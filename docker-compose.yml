version: "3.9"

services:
  mongodb:
    image: mongo:7.0
    container_name: smartsell-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - smartsell-net
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: smartsell-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - smartsell-net
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smartsell-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - MONGODB_URI=mongodb://mongodb:27017
      - QDRANT_HOST=qdrant
    volumes:
      - .:/app
    depends_on:
      - mongodb
      - qdrant
    networks:
      - smartsell-net
    restart: unless-stopped
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  mongo_data:
  qdrant_data:

networks:
  smartsell-net:
    driver: bridge
